name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get version
        id: get_version
        env:
          REF: ${{ github.ref }}
        run: echo "VERSION=${REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p release

          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-X github.com/billmal071/bookdl/internal/cli.Version=${VERSION} -X github.com/billmal071/bookdl/internal/cli.Commit=${COMMIT}" -o release/bookdl-linux-amd64 ./cmd/bookdl

          # Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-X github.com/billmal071/bookdl/internal/cli.Version=${VERSION} -X github.com/billmal071/bookdl/internal/cli.Commit=${COMMIT}" -o release/bookdl-linux-arm64 ./cmd/bookdl

          # macOS amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-X github.com/billmal071/bookdl/internal/cli.Version=${VERSION} -X github.com/billmal071/bookdl/internal/cli.Commit=${COMMIT}" -o release/bookdl-darwin-amd64 ./cmd/bookdl

          # macOS arm64 (Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-X github.com/billmal071/bookdl/internal/cli.Version=${VERSION} -X github.com/billmal071/bookdl/internal/cli.Commit=${COMMIT}" -o release/bookdl-darwin-arm64 ./cmd/bookdl

          # Windows amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-X github.com/billmal071/bookdl/internal/cli.Version=${VERSION} -X github.com/billmal071/bookdl/internal/cli.Commit=${COMMIT}" -o release/bookdl-windows-amd64.exe ./cmd/bookdl

      - name: Create checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
