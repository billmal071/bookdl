linters-settings:
  gosec:
    # Exclude false positives
    excludes:
      - G404  # Weak random - we're using it for jitter in retry backoff, not crypto
      - G401  # MD5 - we're using it for file verification, not crypto

linters:
  enable:
    - gosec
    - gofmt
    - goimports
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - typecheck

run:
  timeout: 5m
